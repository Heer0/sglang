apiVersion: v1
kind: Pod
metadata:
  name: ltx-novgpu
  namespace: soma
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  nodeSelector: { workload: gpu-worker }
  tolerations: [ { key: dedicated, operator: Equal, value: gpu, effect: NoSchedule } ]
  containers:
    - name: sglang
      image: lmsysorg/sglang:latest
      command: ["sleep", "infinity"]
      env:
        - { name: HOME, value: "/data/spike" }
        - { name: HF_HOME, value: "/data/huggingface" }
        - { name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True" }
        - { name: NVIDIA_VISIBLE_DEVICES, value: "all" }
      resources:
        requests: { memory: "12Gi", cpu: "2" }
        limits:   { memory: "36Gi", cpu: "12" }
      volumeMounts:
        - { name: cache, mountPath: /data }
        - { name: code, mountPath: /sgl-workspace/sglang/python/sglang, readOnly: true }
  volumes:
    - { name: cache, persistentVolumeClaim: { claimName: soma-video-ltx-cache } }
    - { name: code, hostPath: { path: /home/heero/Projects/sglang/python/sglang, type: Directory } }
