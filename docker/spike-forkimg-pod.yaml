apiVersion: v1
kind: Pod
metadata:
  name: ltx-forkimg
  namespace: soma
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  nodeSelector: { workload: gpu-worker }
  tolerations: [ { key: dedicated, operator: Equal, value: gpu, effect: NoSchedule } ]
  containers:
    - name: sglang
      image: docker.io/library/sglang-fork:spike
      imagePullPolicy: Never
      command: ["sleep", "infinity"]
      env:
        - { name: NVIDIA_VISIBLE_DEVICES, value: "all" }
        - { name: SOMA_FREE_TEXT_ENCODER, value: "1" }
      resources:
        requests: { memory: "42Gi", cpu: "2" }
        limits:   { memory: "42Gi", cpu: "12" }
      volumeMounts:
        - { name: cache, mountPath: /data }
        - { name: code, mountPath: /sgl-workspace/sglang/python/sglang, readOnly: true }
  volumes:
    - { name: cache, persistentVolumeClaim: { claimName: soma-video-ltx-cache } }
    - { name: code, hostPath: { path: /home/heero/Projects/sglang/python/sglang, type: Directory } }
